<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Windows XP — Área de Trabalho</title><style>
*{box-sizing:border-box}html,body{height:100%;margin:0;overflow:hidden;font:12px Tahoma,Verdana,sans-serif;color:#111}body{background:linear-gradient(180deg,#1767bc 0%,#6eb8f4 43%,#d8f0ff 58%,#3b8c24 59%,#54a42b 100%);user-select:none}.desktop{position:absolute;inset:0 0 40px;padding:18px;display:flex;align-content:flex-start;align-items:flex-start;flex-direction:column;flex-wrap:wrap;gap:8px}.deskicon{width:82px;color:white;text-align:center;padding:7px 3px;text-shadow:1px 1px #123;cursor:pointer;border:1px solid transparent}.deskicon:hover{background:#2e70b966;border:1px dotted #fff}.deskicon .emoji{display:block;font-size:30px;margin-bottom:5px}#taskbar{position:fixed;bottom:0;left:0;right:0;height:40px;display:flex;align-items:stretch;z-index:1000;background:linear-gradient(#4a92e8,#2461d8 45%,#1747b9);border-top:1px solid #0c3fa5;color:#fff}#start{width:105px;flex:none;border:0;border-radius:0 15px 15px 0;color:#fff;font:bold italic 20px Tahoma;background:linear-gradient(#62c64b,#268d1b);text-shadow:1px 1px #26551d;cursor:pointer;box-shadow:inset 0 1px #b7f4a9}#tasks{display:flex;align-items:center;gap:4px;padding:4px;flex:1;overflow:hidden}.task{height:30px;min-width:100px;max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:left;color:white;border:1px solid #1748a8;border-radius:3px;background:linear-gradient(#4388e4,#245bc5);padding:0 9px;cursor:pointer}.task.active{background:linear-gradient(#174aaf,#2c69d1);box-shadow:inset 1px 1px 3px #163a86}#tray{padding:0 13px;display:flex;align-items:center;background:linear-gradient(#1596e8,#096bc1);border-left:1px solid #0b4fa7;min-width:92px;justify-content:center}#clock{text-align:right;line-height:1.25}#menu{position:fixed;bottom:40px;left:0;width:390px;max-height:calc(100vh - 50px);overflow:auto;background:#fff;border:2px solid #1556bc;border-radius:8px 8px 0 0;box-shadow:3px -2px 12px #0008;z-index:1100;display:none}#menu.open{display:block}.menutop{padding:9px 12px;color:white;font-weight:bold;font-size:15px;background:linear-gradient(#5da3f5,#1257c8);display:flex;gap:10px;align-items:center}.avatar{font-size:27px;background:#d8e9ff;border:2px solid white;border-radius:4px;padding:3px}.columns{display:grid;grid-template-columns:1fr 1fr}.col{padding:5px 0}.col.right{background:#d9e9fa;border-left:1px solid #9abde9}.item{padding:8px 10px;display:flex;align-items:center;gap:9px;cursor:pointer;min-height:37px}.item:hover{background:#316ac5;color:#fff}.item .ico{font-size:21px;width:25px;text-align:center}.item b{display:block;font-size:12px}.item small{display:block;color:#666}.item:hover small{color:#e4edff}.menufoot{display:flex;justify-content:flex-end;gap:12px;padding:8px 12px;color:white;background:linear-gradient(#1760cf,#0c4dbb);cursor:pointer}.window{position:absolute;width:min(700px,calc(100vw - 24px));height:min(480px,calc(100vh - 62px));min-width:280px;min-height:190px;background:#ece9d8;border:1px solid #083c9c;border-radius:7px 7px 0 0;box-shadow:3px 4px 12px #0008;display:flex;flex-direction:column;overflow:hidden}.titlebar{height:30px;flex:none;display:flex;align-items:center;gap:7px;padding:3px 5px 3px 9px;color:white;font-weight:bold;font-size:13px;background:linear-gradient(90deg,#0058e6,#3b8bf4 55%,#0752d4);cursor:move}.titlebar .winico{font-size:17px}.titlebar .caption{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.winbtns{display:flex;gap:2px}.winbtn{width:22px;height:21px;border:1px solid white;border-radius:3px;color:white;font-weight:bold;line-height:17px;text-align:center;background:linear-gradient(#79b7ff,#1761d7);cursor:pointer;box-shadow:inset 0 0 0 1px #2864b7}.winbtn.close{background:linear-gradient(#f89b84,#d63219)}.winbody{flex:1;min-height:0;overflow:auto;background:#fff;border:1px solid #7f9db9;margin:3px;padding:12px;user-select:text}.toolbar{background:#f2f0e8;border-bottom:1px solid #c6c3b8;padding:6px;display:flex;gap:7px;align-items:center}.toolbar button,.xpbtn{font:12px Tahoma;padding:4px 10px;border:1px solid #7f9db9;border-radius:3px;background:linear-gradient(#fff,#e3e0d4);cursor:pointer}.toolbar input{flex:1;min-width:50px;padding:4px;border:1px solid #7f9db9}.appgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(105px,1fr));gap:8px;padding:10px}.appicon{min-height:78px;text-align:center;padding:9px 4px;cursor:pointer;border:1px solid transparent;border-radius:2px}.appicon:hover{background:#e5f1ff;border:1px solid #8ab6e8}.appicon span{display:block;font-size:29px;margin-bottom:5px}.crumb{padding:5px 8px;background:#f3f1e9;border:1px solid #b8b8b0;margin-bottom:8px}.notearea{width:100%;height:100%;min-height:170px;border:0;outline:0;resize:none;font:13px Consolas,monospace;user-select:text}.status{font-size:11px;color:#555;padding:5px;background:#f1f0e8;border-top:1px solid #c7c4b9}.calc{max-width:300px;margin:10px auto;background:#ece9d8;padding:10px;border:1px solid #aaa}.calcdisplay{width:100%;height:42px;text-align:right;font:22px Tahoma;padding:6px;margin-bottom:8px}.calcgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}.calcgrid button{height:37px;font:15px Tahoma;border:1px solid #999;border-radius:3px;background:linear-gradient(#fff,#ddd8c9);cursor:pointer}.calcgrid button.eq{background:linear-gradient(#8cbcff,#3678df);color:white}.center{max-width:500px;margin:24px auto;text-align:center}.bigemoji{font-size:52px}.emailchoice{display:inline-block;width:180px;margin:12px;padding:20px;border:1px solid #a5b8d0;background:#f4f8ff;cursor:pointer}.emailchoice:hover{background:#dcecff}.glogo{font: bold 38px Arial;color:#4285f4;letter-spacing:-2px}.glogo span:nth-child(2){color:#ea4335}.glogo span:nth-child(3){color:#fbbc05}.glogo span:nth-child(4){color:#4285f4}.glogo span:nth-child(5){color:#34a853}.glogo span:nth-child(6){color:#ea4335}.searchbox{width:min(480px,95%);height:38px;border:1px solid #c7c7c7;border-radius:22px;padding:0 15px;font:14px Arial}.searchbtn{padding:9px 15px;border:0;background:#f4f4f4;margin:12px 4px;cursor:pointer}.results{font:14px Arial;text-align:left;max-width:580px;margin:25px auto}.results h3{color:#1a0dab;font-size:18px;font-weight:normal;margin-bottom:5px}.results p{margin-top:0;color:#444}.modalshade{position:fixed;inset:0;background:#0006;z-index:2000;display:flex;align-items:center;justify-content:center}.modal{width:min(430px,calc(100vw - 30px));background:#ece9d8;border:1px solid #0a439f;box-shadow:3px 5px 15px #0008}.modaltitle{background:linear-gradient(90deg,#0757d4,#5b9bf2);color:white;font-weight:bold;padding:8px}.modalcontent{padding:20px;display:flex;gap:14px;align-items:flex-start}.modalfoot{display:flex;justify-content:flex-end;gap:8px;padding:0 15px 15px}.modalfoot button{min-width:85px;padding:6px;border:1px solid #7f9db9;background:linear-gradient(#fff,#e0ddd2);cursor:pointer}.hidden{display:none!important}.paintarea{display:block;width:100%;height:100%;background:white;touch-action:none}.book{font-size:48px}

<script>
(()=>{const $=id=>document.getElementById(id);const apps=[['🖥️','Meu Computador','Página principal'],['🌐','Internet','Navegador Jack Sparrow'],['✉️','E-mail','Mensagens'],['🎨','Paint','Desenho'],['📝','Bloco de Notas','Anotações'],['🧮','Calculadora','Cálculos']];const system=[['📁','Meus Documentos'],['🖼️','Minhas Imagens'],['🎵','Minha Música'],['⚙️','Painel de Controle'],['🖨️','Impressoras'],['❔','Ajuda e Suporte']];let windows=[],z=10,notepadText='',notepadSaved='',calcExpr='0',folder='Meu Computador';
function fillMenu(id,list){$(id).innerHTML=list.map(a=>`<div class="item" data-app="${a[1]}"><span class="ico">${a[0]}</span><span><b>${a[1]}</b>${a[2]?`<small>${a[2]}</small>`:''}</span></div>`).join('')}fillMenu('programs',apps);fillMenu('system',system);
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function openApp(name){$('menu').classList.remove('open');if(name==='Impressoras'){window.print();return}if(name==='Desligar'){shutdownDialog();return}if(name==='Fazer logoff'){showLogin();return}let existing=windows.find(w=>w.name===name&&!w.closed);if(existing){restore(existing);return}let w={id:Date.now()+Math.random(),name,closed:false,min:false,max:false,old:null};windows.push(w);let win=document.createElement('section');win.className='window';win.style.left=(45+(windows.length*27)%170)+'px';win.style.top=(35+(windows.length*23)%100)+'px';win.style.zIndex=++z;win.innerHTML=`<div class="titlebar"><span class="winico">${iconFor(name)}</span><span class="caption">${esc(name)}</span><div class="winbtns"><button class="winbtn" data-act="min" title="Minimizar">_</button><button class="winbtn" data-act="max" title="Maximizar">□</button><button class="winbtn close" data-act="close" title="Fechar">×</button></div></div><div class="toolbar" id="tool-${w.id}"></div><div class="winbody" id="body-${w.id}"></div><div class="status" id="status-${w.id}">Pronto</div>`;document.body.append(win);w.el=win;w.body=win.querySelector('.winbody');w.toolbar=win.querySelector('.toolbar');w.task=document.createElement('button');w.task.className='task';w.task.textContent=iconFor(name)+' '+name;$('tasks').append(w.task);w.task.onclick=()=>{if(w.min)restore(w);else if(w.el.style.zIndex==z)minimize(w);else focus(w)};win.addEventListener('mousedown',()=>focus(w));win.querySelectorAll('[data-act]').forEach(b=>b.onclick=e=>{e.stopPropagation();({min:()=>minimize(w),max:()=>maximize(w),close:()=>closeWindow(w)})[b.dataset.act]()});makeDraggable(w);render(w);focus(w)}
function iconFor(n){return ({'Meu Computador':'🖥️','Internet':'🏴‍☠️','E-mail':'✉️','Paint':'🎨','Bloco de Notas':'📝','Calculadora':'🧮','Meus Documentos':'📁','Minhas Imagens':'🖼️','Minha Música':'🎵','Painel de Controle':'⚙️','Ajuda e Suporte':'❔','Fazer logoff':'🔒'})[n]||'📄'}function focus(w){if(w.closed)return;w.min=false;w.el.classList.remove('hidden');w.el.style.zIndex=++z;windows.forEach(x=>x.task.classList.toggle('active',x===w));w.task.classList.add('active')}function minimize(w){w.min=true;w.el.classList.add('hidden');w.task.classList.remove('active')}function restore(w){focus(w)}function maximize(w){if(!w.max){w.old={left:w.el.style.left,top:w.el.style.top,width:w.el.style.width,height:w.el.style.height};Object.assign(w.el.style,{left:'3px',top:'3px',width:'calc(100vw - 6px)',height:'calc(100vh - 46px)'});w.max=true}else{Object.assign(w.el.style,w.old);w.max=false}}function closeWindow(w){if(w.name==='Bloco de Notas'&&notepadText!==notepadSaved){modal('Bloco de Notas','Você deseja salvar as alterações?',[['Salvar',()=>{saveNote();reallyClose(w)}],['Não salvar',()=>reallyClose(w)],['Cancelar',()=>{}]]);return}reallyClose(w)}function reallyClose(w){w.closed=true;w.el.remove();w.task.remove();windows=windows.filter(x=>x!==w)}function makeDraggable(w){let bar=w.el.querySelector('.titlebar'),sx,sy,l,t;bar.addEventListener('mousedown',e=>{if(e.target.closest('button')||w.max)return;sx=e.clientX;sy=e.clientY;l=w.el.offsetLeft;t=w.el.offsetTop;focus(w);function move(ev){w.el.style.left=Math.max(0,Math.min(innerWidth-w.el.offsetWidth,l+ev.clientX-sx))+'px';w.el.style.top=Math.max(0,Math.min(innerHeight-60,t+ev.clientY-sy))+'px'}function up(){document.removeEventListener('mousemove',move);document.removeEventListener('mouseup',up)}document.addEventListener('mousemove',move);document.addEventListener('mouseup',up)})}
function render(w){let b=w.body,t=w.toolbar;switch(w.name){case'Meu Computador':case'Meus Documentos':case'Minhas Imagens':case'Minha Música':renderFolder(w,w.name);break;case'Painel de Controle':b.innerHTML='<div class="center"><div class="bigemoji">⚙️</div><h2>Espere!</h2><p>Espere, você está indo longe demais. Explore outras coisas, por favor.</p></div>';t.innerHTML='';break;case'Ajuda e Suporte':b.innerHTML='<div class="center"><div class="bigemoji">❔</div><h2>Ajuda e Suporte</h2><p>Você pode me encaminhar um e-mail para <a href="mailto:jho1995jho@gmail.com">jho1995jho@gmail.com</a> caso tenha dúvidas ou ideias para compartilhar comigo.</p><p><a href="mailto:jho1995jho@gmail.com">✉️ Enviar e-mail</a></p></div>';t.innerHTML='';break;case'E-mail':b.innerHTML='<div class="center"><h2>Escolha seu serviço de e-mail</h2><div class="emailchoice" data-email="gmail"><div class="bigemoji">✉️</div><b>Gmail</b><p>Abrir em nova aba</p></div><div class="emailchoice" data-email="outlook"><div class="bigemoji">📧</div><b>Outlook</b><p>Abrir em nova aba</p></div></div>';t.innerHTML='';b.querySelectorAll('[data-email]').forEach(x=>x.onclick=()=>window.open(x.dataset.email==='gmail'?'https://mail.google.com/':'https://outlook.live.com/','_blank','noopener'));break;case'Internet':renderInternet(w);break;case'Calculadora':renderCalc(w);break;case'Bloco de Notas':renderNotepad(w);break;case'Paint':renderPaint(w);break;default:b.innerHTML='<div class="center"><h2>'+esc(w.name)+'</h2></div>';t.innerHTML=''}}
const folderItems={'Meu Computador':[['💽','Disco Local (C:)'],['💿','Unidade de CD'],['📁','Documentos Compartilhados'],['📁','Meus Documentos'],['🖼️','Minhas Imagens'],['🎵','Minha Música'],['🖨️','Impressoras'],['⚙️','Painel de Controle']], 'Meus Documentos':[['📁','Documentos de trabalho'],['📁','Downloads'],['📝','Anotações.txt'],['🖼️','Minhas Imagens'],['🎵','Minha Música']], 'Minhas Imagens':[['🖼️','Minhas Imagens'],['📁','Fotos'],['📁','Imagens salvas']], 'Minha Música':[['🎵','Minha Música'],['📁','Músicas favoritas'],['📁','Álbuns']]};function renderFolder(w,name){folder=name;w.toolbar.innerHTML=`<button data-back>◀ Voltar</button><button data-home>⬆ Acima</button><span>Endereço:</span><input readonly value="Meu Computador${name==='Meu Computador'?'':' / '+name}">`;w.body.innerHTML='<div class="appgrid">'+folderItems[name].map(a=>`<div class="appicon" data-folder="${a[1]}"><span>${a[0]}</span>${a[1]}</div>`).join('')+'</div>';w.toolbar.querySelector('[data-back]').onclick=()=>renderFolder(w,'Meu Computador');w.toolbar.querySelector('[data-home]').onclick=()=>renderFolder(w,'Meu Computador');w.body.querySelectorAll('[data-folder]').forEach(el=>el.onclick=()=>{let n=el.dataset.folder;if(folderItems[n])renderFolder(w,n);else if(n==='Impressoras')window.print();else if(n==='Painel de Controle')openApp(n);else if(n.endsWith('.txt'))openApp('Bloco de Notas')})}
function renderInternet(w){w.toolbar.innerHTML='<span>☠️ Jack Sparrow</span><input id="url-'+w.id+'" value="https://gloglo.com" aria-label="Endereço"><button id="go-'+w.id+'">Ir</button>';w.body.innerHTML='<div class="center" style="padding-top:25px"><div style="font-size:22px;margin-bottom:10px">☠️ <b>Jack Sparrow</b></div><div class="glogo"><span>g</span><span>l</span><span>o</span><span>g</span><span>l</span><span>o</span></div><p style="color:#666;font:13px Arial">gloglo.com</p><form id="search-'+w.id+'"><input class="searchbox" id="query-'+w.id+'" aria-label="Pesquisar"><div><button class="searchbtn">Pesquisa Gloglo</button><button type="button" class="searchbtn" id="lucky-'+w.id+'">Estou com sorte</button></div></form><div id="results-'+w.id+'"></div></div>';let search=()=>{let q=w.body.querySelector('#query-'+w.id).value.trim();if(!q)return;w.body.querySelector('#results-'+w.id).innerHTML='<div class="results"><p>Resultados da pesquisa para <b>'+esc(q)+'</b></p><h3>Não encontramos o que você procura. Vá ler um livro.</h3><p>Sua resposta está na biblioteca. Próxima pesquisa, por favor.</p><h3>Você realmente pesquisou isso? Vá ler um livro!</h3><p>O Gloglo recomenda uma pausa de tela e algumas páginas de um bom livro.</p></div>';w.toolbar.querySelector('input').value='https://gloglo.com/search?q='+encodeURIComponent(q)};w.body.querySelector('form').onsubmit=e=>{e.preventDefault();search()};w.body.querySelector('#lucky-'+w.id).onclick=search;w.toolbar.querySelector('button').onclick=search}
function renderCalc(w){w.toolbar.innerHTML='Calculadora';w.body.innerHTML='<div class="calc"><input class="calcdisplay" id="display-'+w.id+'" value="0" readonly><div class="calcgrid">'+['%','CE','C','⌫','1/x','x²','√','÷','7','8','9','×','4','5','6','−','1','2','3','+','±','0','.','='].map((x,i)=>`<button class="${x==='='?'eq':''}" data-key="${x}">${x}</button>`).join('')+'</div></div>';let d=w.body.querySelector('#display-'+w.id),val='0',stored=null,op=null,reset=false;function show(){d.value=val}function number(x){if(reset||val==='0'){val=x==='.'?'0.':x;reset=false}else if(x==='.'&&!val.includes('.'))val+='.';else if(x!=='.')val+=x;show()}function calc(a,b,o){if(o==='+')return a+b;if(o==='−')return a-b;if(o==='×')return a*b;if(o==='÷')return b===0?'Erro':a/b;return b}function press(k){if('0123456789.'.includes(k)&&k.length===1){number(k);return}if(k==='C'||k==='CE'){val='0';stored=null;op=null;reset=false}else if(k==='⌫'){val=val.length>1?val.slice(0,-1):'0'}else if(k==='±'){val=String(-Number(val))}else if(k==='%'){val=String(Number(val)/100)}else if(k==='√'){val=Number(val)<0?'Erro':String(Math.sqrt(Number(val)))}else if(k==='x²'){val=String(Number(val)**2)}else if(k==='1/x'){val=Number(val)===0?'Erro':String(1/Number(val))}else if(['+','−','×','÷'].includes(k)){stored=Number(val);op=k;reset=true}else if(k==='='){if(op&&stored!==null){val=String(calc(stored,Number(val),op));op=null;stored=null;reset=true}}show()}w.body.querySelectorAll('[data-key]').forEach(b=>b.onclick=()=>press(b.dataset.key));w.keyHandler=e=>{if(/^[0-9.]$/.test(e.key))press(e.key);else if(e.key==='Enter'||e.key==='=')press('=');else if(e.key==='Backspace')press('⌫');else if(e.key==='+')press('+');else if(e.key==='-')press('−');else if(e.key==='*')press('×');else if(e.key==='/'){e.preventDefault();press('÷')}};document.addEventListener('keydown',w.keyHandler);let oldClose=closeWindow;w.cleanup=()=>document.removeEventListener('keydown',w.keyHandler)}
function renderNotepad(w){w.toolbar.innerHTML='<button data-save>💾 Salvar como...</button><button data-clear>Limpar</button>';w.body.style.padding='0';w.body.innerHTML='<textarea class="notearea" spellcheck="false" aria-label="Bloco de Notas"></textarea>';let area=w.body.querySelector('textarea');area.value=notepadText;area.oninput=()=>notepadText=area.value;w.toolbar.querySelector('[data-save]').onclick=saveNote;w.toolbar.querySelector('[data-clear]').onclick=()=>{if(confirm('Limpar o conteúdo do Bloco de Notas?')){area.value='';notepadText=''}}}function saveNote(){let name=prompt('Nome do arquivo:','anotacoes.txt');if(name===null)return;if(!name.trim())name='anotacoes.txt';if(!name.toLowerCase().endsWith('.txt'))name+='.txt';let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([notepadText],{type:'text/plain;charset=utf-8'}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);notepadSaved=notepadText}
function renderPaint(w){w.toolbar.innerHTML='<label>Cor <input type="color" id="color-'+w.id+'" value="#000000"></label><button id="clear-'+w.id+'">Limpar tela</button>';w.body.style.padding='0';w.body.innerHTML='<canvas class="paintarea" id="canvas-'+w.id+'"></canvas>';let c=w.body.querySelector('canvas'),ctx=c.getContext('2d');function size(){c.width=c.clientWidth;c.height=c.clientHeight;ctx.fillStyle='white';ctx.fillRect(0,0,c.width,c.height)}size();let down=false;c.onpointerdown=e=>{down=true;ctx.beginPath();ctx.moveTo(e.offsetX,e.offsetY);c.setPointerCapture(e.pointerId)};c.onpointermove=e=>{if(!down)return;ctx.strokeStyle=w.toolbar.querySelector('input').value;ctx.lineWidth=3;ctx.lineCap='round';ctx.lineTo(e.offsetX,e.offsetY);ctx.stroke()};c.onpointerup=c.onpointercancel=()=>down=false;w.toolbar.querySelector('button').onclick=size}
function modal(title,msg,buttons){let sh=document.createElement('div');sh.className='modalshade';sh.innerHTML=`<div class="modal"><div class="modaltitle">${esc(title)}</div><div class="modalcontent"><span style="font-size:30px">ℹ️</span><div>${msg}</div></div><div class="modalfoot"></div></div>`;let foot=sh.querySelector('.modalfoot');buttons.forEach(([label,fn])=>{let b=document.createElement('button');b.textContent=label;b.onclick=()=>{sh.remove();fn()};foot.append(b)});document.body.append(sh)}function shutdownDialog(){modal('Desligar o computador','O que você deseja fazer?',[['Desligar',()=>modal('Desligar','A simulação de desligamento foi concluída. O navegador continuará aberto.',[['OK',()=>{}]])],['Reiniciar',()=>location.reload()],['Hibernar',showLogin],['Cancelar',()=>{}]])}function showLogin(){windows.forEach(w=>{w.closed=true;w.el.remove();w.task.remove()});windows=[];$('menu').classList.remove('open');let sh=document.createElement('div');sh.id='login';sh.style.cssText='position:fixed;inset:0;z-index:3000;background:linear-gradient(#1957a7,#102b68);color:white;display:flex;align-items:center;justify-content:center;text-align:center';sh.innerHTML='<div><div style="font-size:62px">🪟</div><h1>Microsoft Windows XP</h1><p>Para começar, clique no seu usuário</p><button class="xpbtn" id="enter">👤 Jon MRodrigues — Entrar</button></div>';document.body.append(sh);sh.querySelector('#enter').onclick=()=>{sh.remove()}}
$('start').onclick=e=>{e.stopPropagation();$('menu').classList.toggle('open')};document.addEventListener('click',e=>{if(!e.target.closest('#menu')&&!e.target.closest('#start'))$('menu').classList.remove('open')});document.addEventListener('click',e=>{let a=e.target.closest('[data-app]');if(a)openApp(a.dataset.app)});$('desktop').addEventListener('dblclick',e=>{let a=e.target.closest('[data-app]');if(a)openApp(a.dataset.app)});function clock(){let d=new Date();$('clock').innerHTML=d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})+'<br><small>'+d.toLocaleDateString('pt-BR')+'</small>'}clock();setInterval(clock,10000);document.addEventListener('keydown',e=>{if(e.altKey&&e.key==='F4'){e.preventDefault();let w=windows.filter(x=>!x.closed&&!x.min).sort((a,b)=>+b.el.style.zIndex- +a.el.style.zIndex)[0];if(w)closeWindow(w)}if(e.ctrlKey&&e.key.toLowerCase()==='p'){e.preventDefault();window.print()}});window.addEventListener('beforeprint',()=>{document.querySelectorAll('.window').forEach(x=>x.dataset.wasHidden=x.classList.contains('hidden')?'1':'0');document.querySelectorAll('.window').forEach(x=>x.classList.remove('hidden'))});window.addEventListener('afterprint',()=>document.querySelectorAll('.window').forEach(x=>{if(x.dataset.wasHidden==='1')x.classList.add('hidden')}));
})();
</script></body></html>
